<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 定义圆角裁剪（可选，保持整体弧度） -->
  <defs>
    <clipPath id="roundClip">
      <rect width="100" height="100" rx="15" ry="15" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- 背景矩形 -->
    <rect width="100" height="100" fill="white" />

    <!-- 调整折线终点y坐标到10（原0），保证红点显示全 -->
    <path d="M15,75 L30,70 L45,60 L60,40 L75,10"
          stroke="#ff4d4f" stroke-width="3" fill="none"
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- 数据点：最后一个点cy从0改为10，完全显示 -->
    <circle cx="15" cy="75" r="3" fill="#ff4d4f" />
    <circle cx="30" cy="70" r="3" fill="#ff4d4f" />
    <circle cx="45" cy="60" r="3" fill="#ff4d4f" />
    <circle cx="60" cy="40" r="3" fill="#ff4d4f" />
    <circle cx="75" cy="10" r="3" fill="#ff4d4f" /> <!-- 关键修改：cy=10 -->

    <!-- 文字 -->
    <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="14" font-weight="bold" fill="#333">MEGA RICH</text>
  </g>
</svg>